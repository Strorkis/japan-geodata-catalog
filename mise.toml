# **版は固定する** (2026-10-22、利用者と決めた)。`latest` のままだと、入れ直したときにその日の最新が入り、
# 試していない大きな変わり目 (pnpm 12・DuckDB 2.0 など) を意図せず踏む。ライブラリを lockfile で固定しているのと同じ考え。
# **上げるときは意図して上げる**: `mise outdated` で見て (scripts/audit.sh も知らせる)、`mise upgrade --bump <道具>` で
# この版ごと書き換える。Node.js・pnpm・Rust は CI (.github/workflows/) の版も揃えること。
[tools]
# 依存の脆弱性を見る。ソースからのビルドなので初回だけ2分ほどかかる。
"cargo:cargo-audit" = "0.22.2"
duckdb = "1.5.5"
jq = "1.8.2"
# LTS の版。CI (deploy.yml の setup-node) と揃える。
node = "24.22.1"
# CI (deploy.yml の pnpm/action-setup) と揃える。
pnpm = "11.21.0"
# 変換結果をR2へ上げる。`copy` は消さず `sync` は消すので、区別がコマンド名に出る
# (公開中のデータを消さないために copy を使う。docs/deploy.md を参照)。
rclone = "1.75.2"
# CI (ci.yml の rust-toolchain) と揃える。
rust = "1.97.1"
# 参考資料 (PDFなど) を読むためだけに使う。配信データを作る工程には入れない。
# Pythonの版とパッケージはuvが見る (.python-version / pyproject.toml / uv.lock)。
# rust がツールチェーンを、Cargo が crate を見るのと同じ形。
uv = "0.13.4"
