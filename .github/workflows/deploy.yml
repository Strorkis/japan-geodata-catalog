name: Deploy to GitHub Pages

# アプリとDuckDB-WASM本体を GitHub Pages に載せる。
# GeoParquetはここには含めない (Cloudflare R2 に置き、URLを VITE_DATA_BASE_URL で渡す)。
#
# WASMは35〜40MBあるのでgitには入れていない。ビルド時に node_modules から
# dist/duckdb/ にコピーされ (web/vite.config.ts の copy-duckdb-runtime)、
# Pagesのアーティファクトとしてアップロードされる。
#
# **E2E は CI では流さない** (2026-10-16、利用者の判断)。本番ビルドの E2E は push の前に手元で全件流す
# (AGENTS.md)。CI のランナーには GPU が無く、地図をソフトウェアで描くので、3並列だとどの手順も数秒かかって
# 時間切れになり、そのせいで公開が止まった。GPU の弱い機械で描けるかを確かめていたわけでもない。
# **CI でしか確かめられないのは R2 の配信の設定 (CORS・Range) だけ**なので、それは curl で見る (下)。

on:
  push:
    branches: [main]
  # **PR でも build (型・単体テスト・R2 の確認・ビルド) までは流す。** 公開 (deploy) は main のときだけ (下の if)。
  # 作業はブランチで行い、PR で main に入れる (AGENTS.md)。
  pull_request:
  workflow_dispatch:

# 公開に要る権限 (pages・id-token) は deploy のジョブにだけ渡す (PR のビルドには渡さない)。
permissions:
  contents: read

# 公開は同時に走らせない。実行中のデプロイは中断しない (公開中のサイトを壊さないため)。
# PR のビルドは公開と別の組にし、同じ PR の古い実行は止める。
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      # Node.js 20 で動くアクションは非推奨になっているので、
      # Node.js 24 で動くメジャーバージョンを使う (どれも action.yml の `using: node24` を確かめた。2026-10-18)。
      - uses: actions/checkout@v7

      # package.json に packageManager を書いていないので、ここでメジャーを指定する
      # (mise.toml 側は pnpm = "latest" なので、細かく固定しすぎない)。
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      # v6以降、packageManager を見た自動キャッシュはnpmだけになったが、
      # ここでは cache を明示しているので pnpm でも効く。
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # spatial/parquet拡張 (DuckDB本体と同じく自前配信にしてある。
      # web/duckdb-extensions.ts を参照)。DuckDBのバージョンは
      # duckdb-wasm (pnpm-lock.yaml) に紐づくので、それをキーにする。
      # 無ければ vite build 時に取得されるが、キャッシュがあれば約47MBの
      # ダウンロードを毎回省ける。
      - uses: actions/cache@v6
        with:
          path: web/.duckdb-extensions
          key: duckdb-extensions-${{ hashFiles('web/pnpm-lock.yaml') }}

      - run: pnpm exec tsc --noEmit
      # 画面も地図も要らない部品の単体テスト (WKB の読み取りなど)。Node が TypeScript をそのまま読む。
      - run: pnpm test:unit

      # 未設定のままだとデータのURLが空でビルドされ、公開したアプリが何も読めない。ここで止める。
      - name: データの配信先が設定されているか確認
        run: |
          test -n "${{ vars.DATA_BASE_URL }}" || {
            echo "リポジトリ変数 DATA_BASE_URL が未設定です" >&2
            exit 1
          }

      # **R2 の配信の設定を確かめる** (ブラウザは要らない)。DuckDB-WASM は `Range: bytes=0-0` で部分取得できるかを
      # 確かめ、公開サイトのオリジンから Content-Range を読む。どれかが欠けると、全件ダウンロードに落ちるか読めなくなる
      # (docs/duckdb-wasm-range-requests.md)。カタログ (JSON) と、DuckDB が読む GeoParquet (items.parquet) を1バイトずつ読む。
      - name: R2 の CORS と Range を確かめる
        run: |
          # 公開サイトのオリジン。ホスト名は小文字 (R2 の AllowedOrigins も小文字で書いてある)。
          owner='${{ github.repository_owner }}'
          origin="https://${owner,,}.github.io"
          for file in catalog.json items.parquet; do
            headers=$(curl -sS -D - -o /dev/null \
              -H "Origin: $origin" -H 'Range: bytes=0-0' \
              "${{ vars.DATA_BASE_URL }}/$file" | tr -d '\r')
            echo "== $file"; echo "$headers"
            echo "$headers" | grep -qiE '^HTTP/[0-9.]+ 206' || { echo "$file: 206 (部分取得) が返らない" >&2; exit 1; }
            echo "$headers" | grep -qiE '^content-range: bytes 0-0/' || { echo "$file: Content-Range が無い" >&2; exit 1; }
            echo "$headers" | grep -qiE '^access-control-allow-origin: ' || { echo "$file: CORS で許されていない" >&2; exit 1; }
            echo "$headers" | grep -qiE '^access-control-expose-headers: .*content-range' || {
              echo "$file: Content-Range がブラウザに見えない (Access-Control-Expose-Headers)" >&2; exit 1; }
          done

      - run: pnpm build
        env:
          # リポジトリ名のサブパスで配信されるため。
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # データの置き場所。リポジトリの Variables で設定する。
          VITE_DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
          # ⓘ のカードから開く STAC Browser の置き場所 (下で dist/catalog/ に入れる)。
          VITE_STAC_BROWSER_URL: /${{ github.event.repository.name }}/catalog/

      # カタログを地図ではなくページで辿る閲覧画面 (STAC Browser) を /catalog/ に置く。
      # 版を固定して取ってきて、うちの設定とパッチでビルドする (stac-browser/build.sh)。
      # データは上と同じく公開中のオブジェクトストレージから読む (同じオリジンなので CORS は追加不要)。
      - uses: actions/checkout@v7
        with:
          repository: radiantearth/stac-browser
          ref: v5.1.0
          path: .stac-browser-src
      - run: ../stac-browser/build.sh ../.stac-browser-src dist/catalog
        env:
          SB_catalogUrl: ${{ vars.DATA_BASE_URL }}/catalog.json
          SB_pathPrefix: /${{ github.event.repository.name }}/catalog/

      # v4 から、名前が `.` で始まるファイルは入らない。dist には無い (2026-10-18 に確かめた)。足すときは気を付ける。
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: web/dist

  # **公開は main への push (と手動) のときだけ。** PR ではビルドが通るかまでを見る。
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
