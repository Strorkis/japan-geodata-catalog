name: CI

# 変換パイプライン (Rust) の検証。
#
# デプロイとは分けてある。パイプラインが壊れていても、公開中のアプリは
# 既に配信済みのGeoParquetで動き続けるので、デプロイを止める理由がない。
# Web側の検証 (型・単体テスト・R2 の確認・ビルド) は deploy.yml が行う。E2E は push の前に手元で流す (AGENTS.md)。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Range で zip の一部だけ取る道具。パイプラインから切り出してあり、単体で検証する
  # (PROJ を要らないので、パイプラインより早く終わる)。
  remote-zip:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/remote-zip
    steps:
      - uses: actions/checkout@v7
      # mise.toml と同じ版に固定する (stable のままだと、新しい版の clippy の指摘で突然落ちうる)。
      # 版を入力で渡すときは @master を使う (このアクションの使い方)。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/remote-zip
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      # proj クレートはPROJをソースからビルドする
      # (ディストリビューション同梱のlibprojはバージョンが古く使えない)。
      - name: PROJのビルドに必要なパッケージ
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake sqlite3 libsqlite3-dev

      # mise.toml と同じ版に固定する (stable のままだと、新しい版の clippy の指摘で突然落ちうる)。
      # 版を入力で渡すときは @master を使う (このアクションの使い方)。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      # PROJのビルドが重いので、target/ ごとキャッシュする。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pipeline

      # 整形はPROJのビルドを待たずに判定できるので先に置く。
      - run: cargo fmt --check

      - run: cargo clippy --all-targets -- -D warnings

      # tests/real_data.rs は data/ 配下の実ファイルを使うが、
      # git管理外なのでCIではスキップされる (失敗はしない)。
      - run: cargo test
