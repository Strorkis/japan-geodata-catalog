<!doctype html>
<!--
  以前の 3D のページ (Cesium)。いまは地図のページの上のバーで Cesium に切り替える。
  古いリンクのために、同じ場所 (lon/lat/zoom/pitch/bearing) と言語を地図のページへ渡して転送するだけ残す。
-->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>duck-geocoder</title>
    <script>
      const params = new URLSearchParams(location.search);
      params.set('engine', 'cesium');
      location.replace(`./?${params}`);
    </script>
  </head>
  <body></body>
</html>
