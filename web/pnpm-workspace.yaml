# pnpm の設定。pnpm 11 は package.json の "pnpm" ではなくここを読む。
#
# **公開から1日たたない版は入れない** (pnpm 11 の既定の minimumReleaseAge)。足りない版に当たったとき、pnpm が
# minimumReleaseAgeExclude をここへ黙って書き足すことがある (2026-10-12 に起きた)。**例外は足さず、1日待つ。**

overrides:
  # fflate 0.7.4 は壊れた ZIP64 で無限ループする (GHSA-px8p-9vwx-vf98)。0.7.5 で直った (同じ 0.7 の中の修正)。
  # deck.gl の地形 (@deck.gl/geo-layers) が @loaders.gl/compression 経由で入れる。上流が 0.7.5 以上を求めるようになったら外す。
  fflate@<0.7.5: 0.7.5
# texture-compressor (脆弱性のある image-size・sprintf-js を引き込む) は .pnpmfile.cjs で外している (peer なので overrides が効かない)。
