# cargo-audit の設定。
#
# ここに書いた勧告は「見たうえで受け入れた」ものとして扱われる。
# **黙って無視するためではなく、判断を残すために書く。** 受け入れる理由と、
# どうなったら外せるのかを必ず添えること。
#
# 追加するのは、上流の都合で自力では直せない場合に限る。
# 自分の依存を上げれば直るものは、無視せず上げること。

[advisories]
ignore = [
    # quick-xml 0.38.4 のDoS 2件 (属性名の重複チェックが二次関数的に遅くなる /
    # 名前空間宣言の際限ないメモリ確保)。修正は 0.41.0。
    #
    # 受け入れる理由:
    # - CityGMLのパーサ nusamai-citygml / nusamai-plateau が `quick-xml ^0.38` に
    #   固定しているため、こちらの直接依存だけ上げても脆弱な版がツリーに残る
    # - 読むのはG空間情報センターから手動でダウンロードしたPLATEAUのCityGML。
    #   悪意あるXMLを与えられる経路が無い
    # - 動くのは手元のCLIのみ。公開しているサイトにRustのコードは入っていない
    #
    # 外せる条件: nusamai側が quick-xml 0.41 以降に上げたら、
    # pipeline/Cargo.toml の rev を更新してこの2行を消す。
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # zip 4.6.1 の展開まわり 3件 (展開するときに SUID/SGID を残す / 外を指すシンボリックリンクを作る /
    # シンボリックリンク越しに権限を書く)。修正は 9.0.0。2026-10-17 に見た。
    #
    # 受け入れる理由:
    # - **こちらの直接依存の zip は 9.0.4 に上げた** (pipeline・crates/remote-zip)。残っているのは
    #   nusamai-plateau が `zip = "4.6.1"` に固定している分だけ
    # - 3件とも zip を**ディスクへ展開する** (`ZipArchive::extract`・`ZipStreamReader::extract`) ときの問題。
    #   nusamai-plateau はコードリストを zip の中から名前で1件読むだけ (`by_name` → `read_to_end`、
    #   codelist/resolver.rs) で、展開しない。こちらも展開しない
    # - 動くのは手元のCLIのみ。公開しているサイトにRustのコードは入っていない
    #
    # 外せる条件: nusamai-plateau が zip 9 以降に上げたら、pipeline/Cargo.toml の rev を更新してこの3行を消す。
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]
